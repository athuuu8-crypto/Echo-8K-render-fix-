name: Build Echo

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath .

      - name: Bootstrap version file
        run: echo 0 > Echo-main/src/version.txt
        shell: pwsh

      - name: Configure (32-bit)
        working-directory: Echo-main
        run: cmake -B build -A Win32

      - name: Build (Release)
        working-directory: Echo-main
        run: cmake --build build --config Release

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: Echo-dll
          path: Echo-main/build/Release/*.dll
          if-no-files-found: error
